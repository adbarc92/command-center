name: CI

# First CI for command-center (Lane C / roadmap C8).
# On every push and PR: run the lint/type gates (rustfmt,
# clippy, svelte-check + tsc), the Rust tests for both cargo workspaces and the
# frontend's vitest suite, then build the frontend + fleetd sidecar and produce
# Tauri bundles on all three target OSes. Bundles are uploaded as workflow
# artifacts so a reviewer can smoke-test a real build.
#
# TWO CARGO WORKSPACES: the root one (crates/fleet-core, crates/fleetd) and the
# standalone cockpit/ui/src-tauri crate. Nothing run from the repo root reaches
# the latter, so the fmt, clippy and test gates each run once per manifest.
#
# COVERAGE GAP (intentional): the real-Docker integration tests in
# crates/fleetd/tests/ (local_docker_it.rs, preflight_it.rs, swarm_smoke_it.rs)
# are marked `#[ignore]` and need a live Docker daemon + the cc-agent:dev image.
# Hosted GitHub runners do not provide that reliably, so `cargo test --workspace`
# does NOT pass `--ignored` here. Those ITs remain a local / self-hosted-runner
# (dind) gate. See docs/swarm/2026-06-09-launch-readiness.md (Lane L4).

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            cockpit/ui/src-tauri

      - name: Check formatting (root workspace)
        run: cargo fmt --all -- --check

      - name: Check formatting (cockpit/ui/src-tauri)
        run: cargo fmt --all --manifest-path cockpit/ui/src-tauri/Cargo.toml -- --check

      - name: Clippy (root workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Everything below exists only so the tauri crate can be compiled.
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cockpit/ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: cockpit/ui

      # tauri-build fails the compile without this — see the note above.
      - name: Build fleetd sidecar
        run: npm run sidecar
        working-directory: cockpit/ui

      - name: Clippy (cockpit/ui/src-tauri)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: cockpit/ui/src-tauri

  # ---------------------------------------------------------------------------
  # Frontend type gate: `npm run check` is svelte-check over tsconfig.app.json
  # followed by `tsc -p tsconfig.node.json`. Pure type-checking — no Rust, no
  # system deps, so it stands alone and finishes in well under a minute.
  # ---------------------------------------------------------------------------
  check:
    name: svelte-check + tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cockpit/ui
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cockpit/ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check the frontend
        run: npm run check

  # ---------------------------------------------------------------------------
  # Frontend unit tests (vitest + jsdom). Same shape as the type gate above: no
  # Rust, no system deps.
  #
  # This is half of a pair. The regression pin for the plugin_launch main-thread
  # freeze is split across two suites — a Rust test, gated by `cargo test
  # (cockpit)` below, and cockpit/ui/src/App.appPlugin.test.ts, gated here. That
  # file arrives with the plugin-runtime work and is not on main yet; wiring the
  # job now means the JS half is covered the moment it lands, instead of the pin
  # being half-enforced and quietly rotting.
  # ---------------------------------------------------------------------------
  test-ui:
    name: vitest (cockpit/ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cockpit/ui
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cockpit/ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

  # ---------------------------------------------------------------------------
  # Rust workspace tests. Fast, OS-independent gate — runs once on Linux.
  # Does NOT run the `#[ignore]`d real-Docker ITs (see header note above).
  #
  # ROOT WORKSPACE ONLY. The cockpit crate's tests are a separate job below —
  # see the standalone-workspace note on the `lint` job for why they have to be.
  # ---------------------------------------------------------------------------
  test:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      # The real-Docker ITs stay ignored here; hosted runners have no reliable
      # Docker daemon + cc-agent:dev image. This is a documented coverage gap.
      - name: Run workspace tests (Docker ITs stay --ignored)
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # The cockpit crate's own tests — the app-plugin state machine, manifest
  # validation and discovery. `cargo test --workspace` above runs from the repo
  # root and cannot reach them: cockpit/ui/src-tauri is a standalone workspace
  # (see the `lint` job note), so until this job existed that whole suite was
  # verified only by hand on a developer's machine.
  #
  # Same compile prerequisites as clippy: WebKitGTK system deps plus the fleetd
  # sidecar binary that tauri-build resolves at compile time.
  # ---------------------------------------------------------------------------
  test-cockpit:
    name: cargo test (cockpit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            cockpit/ui/src-tauri

      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cockpit/ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: cockpit/ui

      - name: Build fleetd sidecar
        run: npm run sidecar
        working-directory: cockpit/ui

      - name: Run cockpit crate tests
        run: cargo test
        working-directory: cockpit/ui/src-tauri

  # ---------------------------------------------------------------------------
  # Cross-platform Tauri build matrix. Builds the SvelteKit frontend, then the
  # fleetd sidecar (MUST precede `tauri build` — externalBin is resolved at
  # compile time), then the desktop bundle for each OS. Unsigned in CI (no certs
  # present) — this validates the "builds on Win/macOS/Linux" constraint.
  # ---------------------------------------------------------------------------
  build:
    name: tauri build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cockpit/ui
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            cockpit/ui/src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cockpit/ui/package-lock.json

      # Tauri's Linux backend needs WebKitGTK + supporting libs. No-op on
      # Windows/macOS where the system WebView is already present.
      - name: Install Tauri Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      # BUILD ORDER IS LOAD-BEARING: build the fleetd sidecar binary into
      # src-tauri/binaries/ BEFORE `tauri build`. Tauri checks the externalBin
      # resource ("binaries/fleetd-serve") at compile time and fails if absent.
      - name: Build fleetd sidecar
        run: npm run sidecar

      # Unsigned build — no signing secrets are referenced in CI on purpose.
      # Signing happens in release.yml on tags. `tauri build` runs the frontend
      # build (beforeBuildCommand: npm run build) and bundles per OS.
      - name: Build Tauri app (unsigned)
        run: npm run tauri build

      # GAP-132 — look INSIDE the bundle.
      #
      # A green `tauri build` says "it compiled and packaged", never "it packaged the
      # right files". D-8 shipped a bundle containing no plugin root at all and passed
      # a *successful* build on all three OSes, because nothing ever inspected the
      # artifact. `src-tauri/tests/packaged_plugin_root.rs` closes the CONFIG half (the
      # `bundle.resources` mapping exists, and its sources exist on disk); these steps
      # close the ARTIFACT half.
      #
      # The two files asserted are exactly what a packaged handshake needs: the
      # reference plugin's document, and the SDK module it imports. They are read at
      # runtime from `resource_dir()` — see `src-tauri/src/view_plugins.rs`.
      # Each step prints what it did find before failing, so a layout change reports
      # itself instead of silently passing.
      - name: Assert the bundle ships the plugin root (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          test -n "$app" || { echo "no .app bundle was produced"; exit 1; }
          for f in "plugins/reference/index.html" "plugin-sdk/index.js"; do
            test -f "$app/Contents/Resources/$f" || {
              echo "MISSING: $f is not in $app/Contents/Resources"
              find "$app/Contents/Resources" -maxdepth 2 | head -50
              exit 1
            }
          done
          echo "OK: the .app ships the view-plugin root and the SDK"

      - name: Assert the bundle ships the plugin root (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          test -n "$deb" || { echo "no .deb bundle was produced"; exit 1; }
          # Suffix-matched on purpose: assert the entries exist anywhere in the package
          # rather than hard-coding the /usr/lib/<product-name>/ prefix.
          listing=$(dpkg-deb --fsys-tarfile "$deb" | tar -t)
          for f in "plugins/reference/index.html" "plugin-sdk/index.js"; do
            echo "$listing" | grep -q "$f\$" || {
              echo "MISSING: $f is not in $deb"
              echo "$listing" | head -50
              exit 1
            }
          done
          echo "OK: the .deb ships the view-plugin root and the SDK"

      - name: Assert the bundle ships the plugin root (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # MSI and NSIS are compressed installers, so rather than depend on extraction
          # tooling this asserts the staging directory the bundler copies
          # `bundle.resources` into before packaging. If `bundle.resources` were missing
          # (the D-8 state), these paths would not exist.
          $root = "src-tauri/target/release"
          foreach ($f in "plugins/reference/index.html", "plugin-sdk/index.js") {
            if (-not (Test-Path "$root/$f")) {
              Write-Host "MISSING: $f is not under $root"
              Get-ChildItem $root -Depth 2 -ErrorAction SilentlyContinue |
                Select-Object -First 50 -ExpandProperty FullName
              exit 1
            }
          }
          Write-Host "OK: staged resources contain the view-plugin root and the SDK"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: fleet-command-${{ matrix.os }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            cockpit/ui/src-tauri/target/release/bundle/**/*.AppImage
            cockpit/ui/src-tauri/target/release/bundle/**/*.deb
            cockpit/ui/src-tauri/target/release/bundle/**/*.dmg
            cockpit/ui/src-tauri/target/release/bundle/**/*.app
            cockpit/ui/src-tauri/target/release/bundle/**/*.msi
            cockpit/ui/src-tauri/target/release/bundle/**/*.exe
