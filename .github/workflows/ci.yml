name: CI

# First CI for command-center (Lane C / roadmap C8).
# On every push and PR: run the embargo guard, run the Rust workspace tests, then
# build the frontend + fleetd sidecar and produce Tauri bundles on all three target
# OSes. Bundles are uploaded as workflow artifacts so a reviewer can smoke-test a
# real build.
#
# COVERAGE GAP (intentional): the real-Docker integration tests in
# crates/fleetd/tests/ (local_docker_it.rs, preflight_it.rs, swarm_smoke_it.rs)
# are marked `#[ignore]` and need a live Docker daemon + the cc-agent:dev image.
# Hosted GitHub runners do not provide that reliably, so `cargo test --workspace`
# does NOT pass `--ignored` here. Those ITs remain a local / self-hosted-runner
# (dind) gate. See docs/swarm/2026-06-09-launch-readiness.md (Lane L4).

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Embargo guard. The same check the .githooks/pre-commit hook runs locally —
  # duplicated here because a local hook is bypassable with `--no-verify`, and
  # this class of mistake is exactly the kind someone waves through in a hurry.
  # Digest-based, so neither the guard nor its config names what it looks for.
  # See scripts/embargo-guard.mjs.
  # ---------------------------------------------------------------------------
  embargo:
    name: embargo guard
    runs-on: ubuntu-latest
    steps:
      # Full history: this job scans the branch's commit messages, not just its
      # tree. A message on a public branch is as public as a file in it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan tracked files
        run: node scripts/embargo-guard.mjs --all

      - name: Scan this branch's commit messages
        run: |
          base="origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"
          if git rev-parse --verify "$base" >/dev/null 2>&1; then
            git log --format=%B "$base..HEAD" > "$RUNNER_TEMP/msgs.txt"
          else
            git log --format=%B -50 > "$RUNNER_TEMP/msgs.txt"
          fi
          node scripts/embargo-guard.mjs --message "$RUNNER_TEMP/msgs.txt"

  # ---------------------------------------------------------------------------
  # Rust workspace tests. Fast, OS-independent gate — runs once on Linux.
  # Does NOT run the `#[ignore]`d real-Docker ITs (see header note above).
  # ---------------------------------------------------------------------------
  test:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      # The real-Docker ITs stay ignored here; hosted runners have no reliable
      # Docker daemon + cc-agent:dev image. This is a documented coverage gap.
      - name: Run workspace tests (Docker ITs stay --ignored)
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # Cross-platform Tauri build matrix. Builds the SvelteKit frontend, then the
  # fleetd sidecar (MUST precede `tauri build` — externalBin is resolved at
  # compile time), then the desktop bundle for each OS. Unsigned in CI (no certs
  # present) — this validates the "builds on Win/macOS/Linux" constraint.
  # ---------------------------------------------------------------------------
  build:
    name: tauri build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cockpit/ui
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            cockpit/ui/src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cockpit/ui/package-lock.json

      # Tauri's Linux backend needs WebKitGTK + supporting libs. No-op on
      # Windows/macOS where the system WebView is already present.
      - name: Install Tauri Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      # BUILD ORDER IS LOAD-BEARING: build the fleetd sidecar binary into
      # src-tauri/binaries/ BEFORE `tauri build`. Tauri checks the externalBin
      # resource ("binaries/fleetd-serve") at compile time and fails if absent.
      - name: Build fleetd sidecar
        run: npm run sidecar

      # Unsigned build — no signing secrets are referenced in CI on purpose.
      # Signing happens in release.yml on tags. `tauri build` runs the frontend
      # build (beforeBuildCommand: npm run build) and bundles per OS.
      - name: Build Tauri app (unsigned)
        run: npm run tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: fleet-command-${{ matrix.os }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            cockpit/ui/src-tauri/target/release/bundle/**/*.AppImage
            cockpit/ui/src-tauri/target/release/bundle/**/*.deb
            cockpit/ui/src-tauri/target/release/bundle/**/*.dmg
            cockpit/ui/src-tauri/target/release/bundle/**/*.app
            cockpit/ui/src-tauri/target/release/bundle/**/*.msi
            cockpit/ui/src-tauri/target/release/bundle/**/*.exe
