# Standalone workspace so the parent Cargo workspace doesn't claim this crate.
[workspace]

[package]
name = "app"
version = "0.1.0"
description = "Fleet Command — command-center cockpit shell"
authors = ["command-center"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
log = "0.4"
# LANE-A (app-plugins): the child-webview embedding layer needs Tauri's `unstable`
# feature (multiwebview: create/position/show/hide child webviews). `unstable` is
# explicitly NOT semver-stable, so the version is PINNED with `=` — a patch bump can
# silently change or remove the unstable webview APIs. Note for CI/upgrade docs: bumping
# this line requires re-verifying the embedding smoke (spec §6 step 0), not a blind bump.
tauri = { version = "=2.11.2", features = ["unstable"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
# LANE-P (packaging): activate the updater runtime so the `plugins.updater`
# config Lane B wired in tauri.conf.json actually performs update checks.
tauri-plugin-updater = "2"
ureq = "2"
# LANE-A (dashboard): Audience HTTP poll (§6.2). rustls to avoid an OpenSSL system dep.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# LANE-B (sidecar supervisor): async timers for health-gate polling + restart backoff.
# Already pulled in transitively by tauri/reqwest; `time` is all the supervisor needs.
tokio = { version = "1", features = ["time"] }
sha2 = "0.10"
walkdir = "2"
