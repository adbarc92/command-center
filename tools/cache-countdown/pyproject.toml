[project]
name = "cache-countdown"
version = "0.1.0"
description = "Cache-aware approval timer + cost-at-stake countdown for Claude Code (Command Center roadmap item 1)."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cache-countdown = "cache_countdown.ticker:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cache_countdown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
