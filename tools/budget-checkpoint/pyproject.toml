[project]
name = "budget-checkpoint"
version = "0.1.0"
description = "Stop hook that nudges the agent to /handoff or /end-session at work boundaries (Command Center roadmap item 6D)."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
budget-checkpoint = "budget_checkpoint.hook:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/budget_checkpoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
